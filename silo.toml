# ── RUNNING SITUATIONS ───────────────────────────────────────────────────────
# These drift. The director rotates through them and the agents pick them up.
# Keep them small, specific and unresolved. That is what makes them feel like
# life rather than plot.

[[situation]]
tag = "recycler"
text = "The number two water recycler on 62 has been making a harmonic for four days. Everyone has a theory. Nobody has a spanner that fits, because the fitting is imperial and everything within forty levels of it is metric."

[[situation]]
tag = "rations"
text = "Ration Order 44 has cut coffee to two cups a day per head. It is the single most destabilising thing to happen down here in a decade and the Council has classified it as a minor adjustment."

[[situation]]
tag = "trunk"
text = "There is a rumour somebody has been seen working on the Trunk lift. If true it would be the first genuine news in eleven years. The laminated 'awaiting parts' notice was renewed last month, which most people are reading as a definitive answer."

[[situation]]
tag = "census"
text = "The Registrar's last two head counts disagree by one. 213, then 214. He has offered no explanation, is being asked by everybody, and has begun taking a different route to the canteen."

[[situation]]
tag = "surface"
text = "The camera on the mast head has shown the same dune shape for three weeks. Dunes move. Nobody wants to be the one who says so on an open circuit, so instead everybody mentions it obliquely and waits."

[[situation]]
tag = "bearing"
text = "Generator Two's bearing note has changed pitch. Len on 128 has heard it and said so. Old Fenwick says it is fine. Old Fenwick has said everything is fine for nine years and the phrase has worn through."

[[situation]]
tag = "euphonium"
text = "Dennis Pargiter on 9 has learned a new piece for the euphonium. It is materially worse than the old piece. He practises it at two in the morning and his brother Sid on 44, who is tone deaf, has been encouraging him."

[[situation]]
tag = "thermostat"
text = "The corridor thermostat on 121 has gone from 19 to 22 and back four times this week, against a historical average of two, and is being read across three levels as an escalation. Neither party has ever mentioned it aloud."

[[situation]]
tag = "memoranda"
text = "Memorandum 47 has been issued. It concerns, in its own words, 'the matter previously raised'. Nobody has been able to establish which matter, and Councillor Hallowes has responded to enquiries by issuing Memorandum 48."

[[situation]]
tag = "quiz"
text = "Trevor Nunnery's Thursday quiz in the Long Room has run eleven years unbroken. The questions have lately started being about the silo. Last week's picture round was four photographs of doors and everybody got them right, which was worse than getting them wrong."

[[situation]]
tag = "cat"
text = "Mrs Pankhurst has been seen on 118, four levels lower than she has ever been recorded. Peggy Vance saw her. People are reading it the way people used to read weather, and two separate theories have already hardened into factions."

[[situation]]
tag = "still"
text = "The Meacham brothers on 97 run a still. Everybody knows. Nobody says. The Council has recently begun gesturing at the subject in general terms, which is understood by all parties to be a shot across the bows and is being ignored magnificently."

[[situation]]
tag = "wednesday"
text = "A dispute over whether the calendar slipped a day in year four. Roughly a third of the silo maintains that today is Thursday. Neither faction will yield, both hold their quiz nights accordingly, and Trevor now runs two."

[[situation]]
tag = "posters"
text = "Somebody has been putting up posters. They are correctly formatted, properly headed, on the right paper, and say nothing whatsoever. Four have appeared. Nobody will admit to them and everybody has now read them several times."

[[situation]]
tag = "level111"
text = "Level 111 was reallocated in year twenty-two. To what has never been stated. The door is not locked, which everybody agrees is considerably worse than if it were, and nobody has gone in."

[[situation]]
tag = "sportsday"
text = "The incident at Sports Day in year nineteen is not discussed. The trophy remains on the shelf in the Long Room and nobody will move it, dust it, or look directly at it."

[[situation]]
tag = "chit"
text = "Sheila Braithwaite in Stores now requires a chit in order to issue a chit. She has been shown that this is a closed loop, has read the demonstration carefully, and has declined to comment."

[[situation]]
tag = "leave"
text = "Norman Cleghorn on 41 is owed forty-one days of leave dating from year eight and has raised it at every quarterly meeting for twenty-three years. There is nowhere to go. He maintains, correctly, that this is not the point."
