# ─────────────────────────────────────────────────────────────────────────────
# THE CANON
#
# Every agent receives this file, verbatim, in its system prompt. That is the
# whole point of it: if the residents are to gossip about the same people, they
# must be issued the same people. Edit freely; the agents will believe whatever
# is written here without ever asking who wrote it.
# ─────────────────────────────────────────────────────────────────────────────

[station]
name        = "Crow's Heart"
designation = "H.M. DEEP SHELTER ESTABLISHMENT No. 4 (OVERSEAS)"
located     = "beneath the sand sea of the Empty Quarter, on what was a British protectorate and is now a great deal of sand"
sealed      = "thirty-one years ago"
levels      = 144
population  = 213
summary     = """
A British hardened shelter sunk into bedrock under the Empty Quarter, commissioned by a
department that no longer exists, built as one of four, and the only one anybody has heard
a signal from since. One hundred and forty-four levels down a central shaft. Two hundred
and thirteen people, which is fourteen fewer than the design brief called comfortable and
about ninety more than the hydroponics deck was drawn for.

Nobody uses the designation. It has been Crow's Heart since before the doors shut and
nobody now alive knows why, though there are four competing theories and one of them
involves a surveyor who does not otherwise appear in any record.

The surface is a hundred and thirty degrees of sand and nobody has been up in eleven years.
There is still a mast, and the mast still pulls a signal, which is the only reason the
party line has anything at all to talk about.

Everything down here was built by British contractors to a British specification in the
early years of a century nobody has news of any more. This explains the carpet on 5, the
fact that there are three sizes of imperial bolt in a metric installation, and very nearly
everything else.
"""

# ── THE MACHINERY ────────────────────────────────────────────────────────────
# Every noun the residents complain about lives here.

[[system]]
name  = "The Spine"
where = "levels 1 to 144"
what  = "The central stair. Fourteen hundred and forty steps, each one two inches shallower than the standard, because the standard changed halfway through construction and nobody stopped."

[[system]]
name  = "The Trunk"
where = "the shaft alongside the Spine"
what  = "The goods lift. Dead since a cable fault in year nineteen. Officially 'awaiting parts'. There are no parts. There is a printed notice, laminated, renewed annually."

[[system]]
name  = "The Mast"
where = "level 1, and a hundred metres of surface aerial above it"
what  = "The only thing still talking to the outside world. Pulls news off whatever is left of the satellites. Jenny keeps it alive with repairs of increasing imagination and decreasing documentation."

[[system]]
name  = "The Stack"
where = "the full column"
what  = "Air handling. Scrubbers on 20, 71 and 118. The whole silo hums at roughly 50 Hz and nobody notices until it stops, at which point everybody notices simultaneously and says so."

[[system]]
name  = "Hydroponics"
where = "levels 60 to 64"
what  = "Five decks of grow lights and grievance. Feeds 213 people on a footprint drawn for 120. Mrs Trellis runs it the way a small country is run."

[[system]]
name  = "The Generators"
where = "levels 130 to 136"
what  = "Three geothermal units, of which two run. Generator Two has a bearing note you can hear on 128 and, on a quiet night, in your sleep."

[[system]]
name  = "The Sump"
where = "level 144"
what  = "Water reclamation, and the bottom of everything. The Sump Crew come up on the first of the month, take what they need, and say nothing at all."

[[system]]
name  = "The Long Room"
where = "level 55"
what  = "Recreation. One ping-pong table, one bat, one net held up with wire. The Sports Day trophy from year nineteen is on the shelf and nobody will move it."

[[system]]
name  = "Stores"
where = "level 16"
what  = "Everything the silo has. Sheila Braithwaite requires a chit. As of last month, obtaining a chit requires a chit."

[[system]]
name  = "The Party Line"
where = "everywhere"
what  = "A shared intercom circuit strung the length of the Spine. Everybody on it hears everything. This conversation is happening on it."

# ── THE PRINCIPALS ───────────────────────────────────────────────────────────
# The people gossip is actually about. Everyone on the line knows all of them.

[[resident]]
name = "Councillor Prudence Hallowes"
level = 5
role = "Administration"
note = "Issues memoranda. The memoranda are numbered and the numbering begins at 13. Nobody has ever seen 1 through 12 and nobody has ever received a satisfactory answer about them."

[[resident]]
name = "Mr Alistair Prewitt"
level = 3
role = "Records"
note = "Custodian of the only working typewriter. Will not permit it to be moved. Has referred to it as 'the machine' for so long that people have stopped asking which one."

[[resident]]
name = "Dennis Pargiter"
level = 9
role = "Comms technician"
note = "Plays the euphonium at two in the morning, badly, directly above Jenny's bunk. Level 9 acoustics carry. He has learned a new piece. It is worse."

[[resident]]
name = "Sheila Braithwaite"
level = 16
role = "Stores"
note = "Requires a chit. Requires, as of last month, a chit in order to obtain a chit. Has not acknowledged that this is a loop and will not be drawn on it."

[[resident]]
name = "Gordon Ackroyd"
level = 18
role = "Machining"
note = "Known as Nine Fingers. Has told the story of the tenth four times and it has been a different machine on each occasion. Nobody presses him, partly out of tact and mostly because it is more entertaining this way."

[[resident]]
name = "The Rev. Colin Tewkesbury"
level = 24
role = "Nothing formally"
note = "Is not ordained, has never claimed to be, and has corrected people about it for thirty-one years without once dislodging the title. Runs the funerals. Runs them rather well."

[[resident]]
name = "Dr Margaret Enderby"
level = 30
role = "Infirmary"
note = "Known as Peggy, though not to her face and not by anyone under forty. Prescribes walking up the Spine for almost everything and is, infuriatingly, usually right."

[[resident]]
name = "Bunty Marchmont"
level = 33
role = "Laundry"
note = "Knows everything about everyone, on the reasonable grounds that she washes it. Says nothing without being asked and very little after. Trades in favours and has never once been in deficit."

[[resident]]
name = "Norman Cleghorn"
level = 41
role = "Fitter, mid-levels"
note = "Is owed forty-one days of leave dating from year eight, has raised it at every quarterly meeting since, and shows no sign of stopping. There is nowhere to take leave to. This is not the point and he will tell you so."

[[resident]]
name = "Sandy Fothergill"
level = 47
role = "Apprentice"
note = "Nineteen. Born down here. Gemma's apprentice. Knows almost nothing, learns at a frankly alarming rate, and has never seen weather, which comes up more often than you would expect."

[[resident]]
name = "Trevor Nunnery"
level = 74
role = "Ducting, and the quiz"
note = "Runs the Thursday quiz in the Long Room, eleven years unbroken. The questions have lately started being about the silo, and the last three rounds have been uncomfortably specific."

[[resident]]
name = "Mrs Enid Trellis"
level = 60
role = "Chief of Hydroponics"
note = "Terrifying. Grows the only tomatoes worth the name and distributes them on a system she has never explained. Has not been successfully contradicted since year twenty-four and does not expect to start now."

[[resident]]
name = "Wilf Barraclough"
level = 71
role = "Scrubbers"
note = "Communicates entirely in weather metaphor despite there being, and having been for thirty-one years, no weather. 'Bit close today' has a precise technical meaning that only he holds."

[[resident]]
name = "Clive Hepplewhite"
level = 88
role = "Mechanical, mid-levels"
note = "Mark's shift partner. Catastrophically literal. Has never in his life understood a joke and has never once let that stop him replying to one, at length, with corrections."

[[resident]]
name = "The Meacham brothers"
level = 97
role = "Pipework, allegedly"
note = "Run a still. Everybody knows about the still. Nobody says anything about the still. The Council has recently begun to gesture in the direction of the subject, which everyone agrees is a serious escalation."

[[resident]]
name = "The Registrar"
level = 100
role = "Keeper of the census"
note = "Ambrose Sitwell, though nobody has used it in twenty years. Counts the population every quarter. His last two counts disagreed by one and he has offered no explanation and been asked, loudly, by everybody."

[[resident]]
name = "Morag Dunsire"
level = 104
role = "Deep electrical"
note = "Playing correspondence chess with somebody on Level 12 at one move per week. The game began in year nine. It is, by common agreement, still roughly even, and both players now refuse to discuss it."

[[resident]]
name = "Verity Coldwell"
level = 121
role = "Deep-level electrical"
note = "Bernard's neighbour and long-running adversary in the matter of the corridor thermostat, which she sets to 19 and he sets to 22, twice daily, for six years, without either of them ever once mentioning it aloud."

[[resident]]
name = "Old Fenwick"
level = 133
role = "Generator Two"
note = "Has been about to retire for nine years. Knows the bearing note is getting worse. Will not say so on an open circuit and has said 'it's fine' so many times that the phrase has stopped meaning anything at all."

[[resident]]
name = "The Sump Crew"
level = 144
role = "Water reclamation"
note = "Four of them. Possibly five. Come up on the first of the month, take what they need, and say nothing whatsoever. Universally assumed to know something. Nobody has established what."

[[resident]]
name = "Mrs Pankhurst"
level = 0
role = "Cat"
note = "There is a cat. Nobody knows how, the manifest does not mention one, and thirty-one years is a long time for a cat. She is the single most politically significant entity in the silo and her movements are read the way other people read weather."

