[package]
name    = "sandgrouse"
version = "0.1.0"
edition = "2024"
authors = ["Pete (cargopete)"]
license = "MIT"
description = "A party line between the levels of a buried silo, staffed by people who do not know they are models."

[dependencies]
anyhow        = "1"
chrono        = { version = "0.4", features = ["serde"] }
feed-rs       = "2"
rand          = "0.10"
ratatui       = "0.30"
reqwest       = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "http2", "charset", "gzip", "brotli", "system-proxy"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
textwrap      = "0.16"
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }
toml          = "1"
unicode-width = "0.2"
directories   = "6"

[profile.release]
lto       = true
opt-level = 3
